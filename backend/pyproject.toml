[project]
name = "editalcheck"
version = "0.1.0"
description = "Verificador bidirecional Edital × IFC (Hackathon Open BIM + IA)"

requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pymupdf>=1.24",
    "ifcopenshell>=0.8",
    "ifctester>=0.8",
    "bcf-client>=0.8",
    "httpx>=0.27",
    "google-genai>=1.0",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
editalcheck = "editalcheck.entrypoints.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editalcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # o ruff format controla o tamanho das linhas

[tool.ruff.lint.per-file-ignores]
"src/editalcheck/entrypoints/api/main.py" = ["B008"]  # File(...) é o padrão do FastAPI
