########################### NETWORKS
networks:
  proxy:
    external: true

########################### VOLUMES
# Únicos dados em disco: o log de auditoria (sem conteúdo do usuário) e o cache do bSDD
# (dados públicos). Edital, IFC, lições e relatórios ficam só na memória (modo efêmero).
volumes:
  auditoria:
  bsdd:

########################### SERVICES
# Servidor: /mnt/dados/atena/projects/hackathon/
# Endpoint: https://atena.construtivo.com/editalcheck/
#
# A imagem é autocontida (código + frontend compilado). Para atualizar:
#   git pull && docker compose build && docker compose up -d
name: editalcheck
services:
  app:
    build:
      context: .
      dockerfile: py3_12-ifcopenshell.Dockerfile
      args:
        # Caminho público do frontend: precisa bater com o prefixo do Traefik abaixo.
        BASE_PATH: /editalcheck/
    image: editalcheck:latest
    env_file:
      - .env.deploy
    environment:
      # Definidos aqui (e não no .env.deploy) porque o deploy depende deles.
      # Prefixo removido pelo Traefik: o /docs da API usa para achar o /openapi.json.
      EDITALCHECK_ROOT_PATH: /editalcheck
      # Modo efêmero (RNF-11): edital, IFC, lições e relatórios ficam só na RAM do contêiner.
      # Uma única réplica (ou a sessão fixa configurada abaixo) atende cada projeto.
      EDITALCHECK_MODO_DADOS: efemero
      # Documentação interativa da API (/docs) desligada em produção.
      EDITALCHECK_DOCS: "false"
      # Só o Traefik fala com o contêiner (rede proxy): os cabeçalhos X-Forwarded-* dele valem.
      FORWARDED_ALLOW_IPS: "*"
    # Endurecimento: sistema de arquivos só leitura, /tmp em memória (uploads grandes passam
    # por ele), sem capabilities do Linux e sem escalada de privilégio.
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - auditoria:/app/var/auditoria
      - bsdd:/app/.cache/bsdd
    deploy:
      resources:
        limits:
          cpus: "${EDITALCHECK_CPUS:-4}"
          memory: "${EDITALCHECK_MEMORIA:-6g}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # Força o Traefik a se comunicar pela rede correta
      - "traefik.docker.network=proxy"

      # Roteador Principal (frontend e API sob /editalcheck)
      - "traefik.http.routers.editalcheck.entrypoints=http,https"
      - "traefik.http.routers.editalcheck.rule=Host(`${APP_DOMAIN:-atena.construtivo.com}`) && PathPrefix(`/editalcheck`)"
      - "traefik.http.routers.editalcheck.tls=true"
      - "traefik.http.routers.editalcheck.middlewares=editalcheck-stripprefix@docker"
      - "traefik.http.routers.editalcheck.service=editalcheck-app"

      # Definição do Middleware de StripPrefix para este microsserviço
      - "traefik.http.middlewares.editalcheck-stripprefix.stripprefix.prefixes=/editalcheck"

      # Define a Porta do Traefik + Loadbalancer
      - "traefik.http.services.editalcheck-app.loadbalancer.server.port=8000"

      # Sessão fixa: o projeto fica na memória de uma réplica só
      - "traefik.http.services.editalcheck-app.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.editalcheck-app.loadbalancer.sticky.cookie.name=editalcheck_session"
      - "traefik.http.services.editalcheck-app.loadbalancer.sticky.cookie.httpOnly=true"
      - "traefik.http.services.editalcheck-app.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.editalcheck-app.loadbalancer.sticky.cookie.sameSite=lax"
