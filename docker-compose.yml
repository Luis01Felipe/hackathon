########################### NETWORKS
networks:
  proxy:
    external: true

########################### EXTENSION FIELDS
x-environment: &default-tz-puid-pgid
  TZ: America/Sao_Paulo
  PUID: 1000
  PGID: 1000

x-common-keys-proxy: &common-keys-proxy
  networks:
    - proxy
  security_opt:
    - no-new-privileges:true
  restart: always

x-common-keys-dual: &common-keys-dual
  networks:
    - proxy
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

########################### SERVICES
# Servidor: /mnt/dados/atena/projects/hackathon/
# Endpoint: https://atena.construtivo.com/editalcheck/
name: editalcheck
services:
  app:
    <<: *common-keys-proxy
    build:
      context: .
      dockerfile: py3_12-ifcopenshell.Dockerfile
      args:
        # Caminho público do frontend: precisa bater com o prefixo do Traefik abaixo.
        BASE_PATH: /editalcheck/
    image: editalcheck:latest
    env_file:
      - .env.deploy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace/backend/src
      - TZ=America/Sao_Paulo
      - APP_DOMAIN=${APP_DOMAIN:-atena.construtivo.com}
      # Prefixo removido pelo Traefik: o /docs da API usa para achar o /openapi.json.
      - EDITALCHECK_ROOT_PATH=/editalcheck
    volumes:
      # Código do repositório. Projetos e relatórios ficam em ./var e o cache do LLM em ./.cache.
      - ".:/workspace:rw"
    working_dir: /workspace
    command: [ "python", "-m", "editalcheck.entrypoints.cli", "servidor", "--host", "0.0.0.0", "--porta", "8000" ]
    labels:
      - "traefik.enable=true"

      # Força o Traefik a se comunicar pela rede correta
      - "traefik.docker.network=proxy"

      # Roteador Principal (frontend, API e /docs sob /editalcheck)
      - "traefik.http.routers.editalcheck.entrypoints=http,https"
      - "traefik.http.routers.editalcheck.rule=Host(`${APP_DOMAIN:-atena.construtivo.com}`) && PathPrefix(`/editalcheck`)"
      - "traefik.http.routers.editalcheck.tls=true"
      - "traefik.http.routers.editalcheck.middlewares=editalcheck-stripprefix@docker"
      - "traefik.http.routers.editalcheck.service=editalcheck-app"

      # Definição do Middleware de StripPrefix para este microsserviço
      - "traefik.http.middlewares.editalcheck-stripprefix.stripprefix.prefixes=/editalcheck"

      # Define a Porta do Traefik + Loadbalancer
      - "traefik.http.services.editalcheck-app.loadbalancer.server.port=8000"

      # Sticky Session
      - "traefik.http.services.editalcheck-app.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.editalcheck-app.loadbalancer.sticky.cookie.name=editalcheck_session"
      - "traefik.http.services.editalcheck-app.loadbalancer.sticky.cookie.httpOnly=true"
    networks:
      - proxy
    restart: unless-stopped
